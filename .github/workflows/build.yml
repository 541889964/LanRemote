name: Build LanRemote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0.2'

    - name: Build TV APK (first)
      run: gradle :app-tv:assembleDebug --no-daemon --stacktrace

    - name: Embed TV APK into Mobile assets
      run: |
        mkdir -p app-mobile/src/main/assets
        cp app-tv/build/outputs/apk/debug/app-tv-debug.apk \
           app-mobile/src/main/assets/lanremote-tv.apk
        ls -la app-mobile/src/main/assets/

    - name: Build Mobile APK (with TV inside)
      run: gradle :app-mobile:assembleDebug --no-daemon --stacktrace

    - name: Collect APK
      run: |
        mkdir -p out
        cp app-mobile/build/outputs/apk/debug/app-mobile-debug.apk out/
        ls -la out/

    - name: Version
      id: ver
      run: echo "v=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.v }}
        name: "LanRemote v${{ steps.ver.outputs.v }}"
        body: |
          LanRemote 全自动版
          - 打开 App 即自动扫描、连接、部署、启动、遥控
        files: out/*.apk
        draft: false
        prerelease: false
