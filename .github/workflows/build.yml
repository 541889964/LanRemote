name: Build LanRemote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0.2'

    - name: Verify Gradle
      run: gradle --version

    - name: Build Mobile APK
      run: gradle :app-mobile:assembleDebug --no-daemon --stacktrace

    - name: Build TV APK
      run: gradle :app-tv:assembleDebug --no-daemon --stacktrace
      continue-on-error: true

    - name: Collect APKs
      run: |
        mkdir -p out
        find . -name "*.apk" -path "*debug*" -exec cp {} out/ \;
        ls -la out/

    - name: Version
      id: ver
      run: echo "v=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.v }}
        name: "LanRemote v${{ steps.ver.outputs.v }}"
        body: |
          LanRemote 修正版
          - 修复 setup-android tools 包下架问题
          - 修复 gradle-version 格式
        files: out/*.apk
        draft: false
        prerelease: false
