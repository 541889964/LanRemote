name: Build LanRemote
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0.2'
    - name: Build TV APK
      run: gradle :app-tv:assembleDebug --no-daemon
    - name: Embed TV into Mobile
      run: |
        mkdir -p app-mobile/src/main/assets
        cp app-tv/build/outputs/apk/debug/app-tv-debug.apk app-mobile/src/main/assets/lanremote-tv.apk
    - name: Build Mobile APK
      run: gradle :app-mobile:assembleDebug --no-daemon
    - name: Collect
      run: |
        mkdir -p out
        cp app-mobile/build/outputs/apk/debug/app-mobile-debug.apk out/
    - name: Version
      id: ver
      run: echo "v=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.v }}
        name: "LanRemote v${{ steps.ver.outputs.v }}"
        body: "等待授权重试版"
        files: out/*.apk
